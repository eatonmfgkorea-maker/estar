<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ECEAE5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E-Star">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' fill='%23141414'/><text x='96' y='128' font-size='96' font-weight='900' font-family='Arial' text-anchor='middle' fill='%23D63A0E'>E★</text></svg>">
<title>E-Star | MFG 전용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* MFG 포털(MFG Production Management System)과 같은 테마 — 베이지 바탕 · 검은 굵은 선 · 주황 포인트 */
:root { --bg:#ECEAE5; --ink:#141414; --sub:#4A4843; --muted:#5A5853; --num:#CBC6BC; --acc:#D63A0E; --hover:#E3E0D9; --field:#F7F6F2; --ok:#141414; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:var(--bg); color:var(--ink); }
body { font-family:'Gothic A1','Malgun Gothic',-apple-system,sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
button, input, select, textarea { font-family:inherit; }

.wrap { max-width:560px; margin:0 auto; padding:32px 20px 0; }

/* 머리 */
.plant { display:flex; justify-content:space-between; align-items:center; gap:12px; padding-bottom:12px; border-bottom:2px solid var(--ink); font-size:13px; font-weight:700; letter-spacing:0.1em; }
.plant span:last-child { letter-spacing:0; color:var(--acc); }
.brand { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:18px 0 6px; }
.brand h1 { font-size:clamp(76px, 22vw, 112px); line-height:0.86; font-weight:900; letter-spacing:-0.055em; }
.brand h1 i { font-style:normal; color:var(--acc); }
.brand .home { font-size:13px; font-weight:700; color:var(--ink); text-decoration:none; border-bottom:1.5px solid var(--ink); padding-bottom:2px; white-space:nowrap; margin-bottom:8px; }
.brand .home:hover { color:var(--acc); border-color:var(--acc); }
.sys { font-size:24px; line-height:1.2; font-weight:900; letter-spacing:-0.03em; padding-bottom:4px; }
.sys span { display:block; font-size:13px; font-weight:700; letter-spacing:0; color:var(--muted); margin-top:4px; }

/* 탭 */
.tabs { display:flex; gap:24px; margin-top:28px; border-bottom:6px solid var(--ink); }
.tab { display:flex; align-items:baseline; gap:8px; padding:0 0 10px; background:none; border:0; font-size:26px; font-weight:900; letter-spacing:-0.035em; color:var(--num); cursor:pointer; transition:color .15s; }
.tab:hover { color:var(--acc); }
.tab.active { color:var(--ink); }
.tab .tab-count { font-size:15px; font-weight:900; color:var(--acc); letter-spacing:0; font-variant-numeric:tabular-nums; }

/* 서버 상태 */
.sync-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0 4px; }
.sync-status { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:500; color:var(--muted); min-width:0; }
.sync-dot { width:8px; height:8px; background:var(--num); flex-shrink:0; }
.sync-dot.connected { background:var(--ink); }
.sync-dot.error { background:var(--acc); }
.sync-dot.loading { background:var(--acc); animation:blink 1s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.3; } }
.sync-btn { background:none; border:0; border-bottom:1.5px solid var(--ink); padding:2px 0; font-size:12px; font-weight:700; color:var(--ink); cursor:pointer; white-space:nowrap; }
.sync-btn:hover { color:var(--acc); border-color:var(--acc); }

/* 본문 */
.content { padding:12px 0 72px; }
.panel { display:none; }
.panel.active { display:block; animation:fadeIn .25s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

/* 접수 양식 */
.form-group { padding:16px 0 18px; border-bottom:1.5px solid var(--ink); }
.form-label { display:flex; align-items:baseline; gap:10px; font-size:17px; font-weight:900; letter-spacing:-0.02em; margin-bottom:10px; }
.form-label .num { font-size:15px; font-weight:900; color:var(--acc); font-variant-numeric:tabular-nums; letter-spacing:0; }
.form-label .required { color:var(--acc); font-size:15px; }
.form-input, .form-select { width:100%; height:46px; padding:0 12px; border:1.5px solid var(--ink); border-radius:2px; background:var(--field); color:var(--ink); font-size:16px; outline:none; transition:background .15s, border-color .15s; }
.form-input:focus, .form-select:focus { background:#fff; border-color:var(--acc); }
.form-input::placeholder { color:#A8A39A; }
.form-input.error, .form-select.error { border-color:var(--acc); background:#FBEDE8; }
textarea.form-input { height:auto; min-height:120px; padding:10px 12px; line-height:1.65; resize:vertical; }
.char-count { text-align:right; font-size:12px; font-weight:500; color:var(--muted); margin-top:6px; font-variant-numeric:tabular-nums; }
.select-wrap { position:relative; }
.select-wrap::after { content:''; position:absolute; right:14px; top:50%; width:8px; height:8px; border-right:2px solid var(--ink); border-bottom:2px solid var(--ink); transform:translateY(-70%) rotate(45deg); pointer-events:none; }
.form-select { padding-right:36px; appearance:none; -webkit-appearance:none; cursor:pointer; }
.form-select.placeholder { color:#A8A39A; }
.submit-btn { width:100%; height:56px; margin-top:24px; border:0; border-radius:2px; background:var(--ink); color:var(--bg); font-size:17px; font-weight:900; letter-spacing:-0.01em; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:background .15s; }
.submit-btn:hover { background:var(--acc); }
.submit-btn:disabled { opacity:.6; cursor:not-allowed; }
.spinner { width:18px; height:18px; border:2.5px solid rgba(236,234,229,.35); border-top-color:var(--bg); border-radius:50%; animation:spin .6s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* 목록 */
.list-header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 0 12px; }
.list-title { font-size:20px; font-weight:900; letter-spacing:-0.03em; }
.list-count { font-size:13px; font-weight:700; color:var(--acc); font-variant-numeric:tabular-nums; }
.export-btn { height:32px; padding:0 12px; border:1.5px solid var(--ink); border-radius:2px; background:transparent; color:var(--ink); font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
.export-btn:hover { background:var(--ink); color:var(--bg); }
.export-btn:disabled { border-color:var(--num); color:var(--muted); background:transparent; cursor:not-allowed; }
.search-bar { display:flex; gap:6px; padding-bottom:12px; border-bottom:6px solid var(--ink); }
.search-input { flex:1; min-width:0; height:38px; padding:0 10px; border:1.5px solid var(--ink); border-radius:2px; background:var(--field); font-size:14px; color:var(--ink); outline:none; }
.search-input:focus { background:#fff; border-color:var(--acc); }
.search-input::placeholder { color:#A8A39A; }
.search-clear { flex-shrink:0; height:38px; padding:0 12px; border:1.5px solid var(--ink); border-radius:2px; background:transparent; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; white-space:nowrap; }
.search-clear:hover { background:var(--ink); color:var(--bg); }
.list-card { padding:16px 0 18px; border-bottom:1.5px solid var(--ink); animation:fadeIn .25s ease; }
.card-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
.card-badge { font-size:12px; font-weight:700; padding:4px 8px; border:1.5px solid var(--ink); border-radius:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.card-top-right { display:flex; align-items:center; gap:8px; }
.card-time { font-size:12px; font-weight:500; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
.card-names { display:flex; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
.card-name { font-size:22px; font-weight:900; letter-spacing:-0.035em; }
.card-arrow { font-size:18px; font-weight:900; color:var(--acc); }
.card-recognizer { font-size:22px; font-weight:900; letter-spacing:-0.035em; }
.card-recognizer::after { content:'님'; font-size:13px; font-weight:700; color:var(--muted); margin-left:3px; letter-spacing:0; }
.card-desc { font-size:14px; line-height:1.7; color:var(--sub); white-space:pre-line; word-break:keep-all; overflow-wrap:anywhere; }
.empty-state { text-align:center; padding:56px 16px; color:var(--muted); }
.empty-state .empty-icon { font-size:44px; font-weight:900; color:var(--num); letter-spacing:-0.04em; margin-bottom:10px; }
.empty-state p { font-size:14px; line-height:1.6; }

/* 알림 */
.toast { position:fixed; top:-80px; left:50%; transform:translateX(-50%); z-index:999; background:var(--ink); color:var(--bg); padding:13px 22px; border-radius:2px; font-size:14px; font-weight:700; white-space:nowrap; transition:top .35s cubic-bezier(.34,1.4,.64,1); }
.toast.show { top:20px; }
.toast.err { background:var(--acc); }

.watermark { max-width:560px; margin:0 auto; padding:0 20px 40px; font-size:12px; color:var(--muted); }

@media (max-width:420px) {
  .wrap { padding-top:24px; }
  .tab { font-size:22px; }
  .tabs { gap:18px; }
  .card-name, .card-recognizer { font-size:19px; }
}
</style>
</head>
<body>

<div class="wrap">
<!-- HEADER -->
<div class="plant"><span>EATON · PYEONGTAEK</span><span>MFG 전용</span></div>
<div class="brand">
  <h1>E<i>-</i>Star</h1>
  <a class="home" href="https://eatonmfgkorea-maker.github.io/MFGManagement/">MFG 포털 ↗</a>
</div>
<div class="sys">공로 인정 접수<span>MFG Recognition · 동료의 공로를 알려주세요</span></div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('submit')">접수하기</button>
  <button class="tab" onclick="switchTab('list')">접수 목록 <span class="tab-count" id="listCount">0</span></button>
</div>

<!-- SYNC BAR -->
<div class="sync-bar">
  <div class="sync-status">
    <span class="sync-dot" id="syncDot"></span>
    <span id="syncText">연결 안됨</span>
  </div>
  <div class="sync-actions">
    <button class="sync-btn" onclick="refreshData()">새로고침</button>
  </div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- SUBMIT PANEL -->
  <div class="panel active" id="panel-submit">
    <div class="form-card">

      <div class="form-group">
        <label class="form-label">
          <span class="num">01</span> 본인 이름 <span class="required">*</span>
        </label>
        <input type="text" class="form-input" id="myName" placeholder="한글 2~4글자">
        <div class="char-count"><span id="myNameCount">0</span>/4</div>
      </div>

      <div class="form-group">
        <label class="form-label">
          <span class="num">02</span> 공로 인정자 이름 <span class="required">*</span>
        </label>
        <input type="text" class="form-input" id="targetName" placeholder="한글 2~4글자">
        <div class="char-count"><span id="targetNameCount">0</span>/4</div>
      </div>

      <div class="form-group">
        <label class="form-label">
          <span class="num">03</span> 공로 선택 <span class="required">*</span>
        </label>
        <div class="select-wrap">
          <select class="form-select placeholder" id="category">
            <option value="" disabled selected>공로를 선택하세요</option>
            <option value="Think Big(크게 생각)">Think Big(크게 생각)</option>
            <option value="Act Boldly(과감하게 행동)">Act Boldly(과감하게 행동)</option>
            <option value="Win Together(함께 성공)">Win Together(함께 성공)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">
          <span class="num">04</span> 공로 내용 <span class="required">*</span>
        </label>
        <textarea class="form-input" id="description" placeholder="구체적인 공로 내용을 입력하세요"></textarea>
        <div class="char-count"><span id="descCount">0</span>/300</div>
      </div>

      <button class="submit-btn" onclick="submitForm()">접수하기</button>
    </div>
  </div>

  <!-- LIST PANEL -->
  <div class="panel" id="panel-list">
    <div class="list-header">
      <span class="list-title">접수 현황</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="list-count" id="totalText">총 0건</span>
        <button class="export-btn" id="exportBtn" onclick="exportExcel()" disabled>엑셀 내보내기</button>
      </div>
    </div>
    <div class="search-bar">
      <input type="text" class="search-input" id="searchSender" placeholder="보낸사람" oninput="filterList()">
      <input type="text" class="search-input" id="searchReceiver" placeholder="받은사람" oninput="filterList()">
      <button class="search-clear" onclick="clearSearch()">초기화</button>
    </div>
    <div id="listContainer">
      <div class="empty-state">
        <div class="empty-icon">0</div>
        <p>아직 접수된 내역이 없습니다.<br>첫 번째 E-Star를 접수해 보세요!</p>
      </div>
    </div>
  </div>

</div>
</div>

<div class="watermark">EATON MFG Pyeongtaek · E-Star Recognition System · v002S</div>

<!-- TOAST -->
<div class="toast" id="toast">접수 완료</div>
<div class="toast err" id="toastError">오류 발생</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let entries = [];
// 서버 (주소 고정 · 공개용 키) — 로그인 없이 접수·조회만 가능
const SB_URL = 'https://tmbeaswlpvsyjehacgsa.supabase.co';
const SB_KEY = 'sb_publishable_OM6ITpYn8LYPWXXhwdA4kQ_HuAyAxV9';
const SB_TABLE = SB_URL + '/rest/v1/estar_entries';
const SB_HEAD = { apikey: SB_KEY };
let SCRIPT_URL = SB_URL;

// 서버에서 전체 목록 (최신순) → 화면용 형태
async function sbFetchEntries() {
  const res = await fetch(SB_TABLE + '?select=id,time,my_name,target_name,category,description&order=created_at.desc,id.desc', { headers: SB_HEAD, cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const rows = await res.json();
  return rows.map(r => ({ id: r.id, time: r.time, myName: r.my_name, targetName: r.target_name, category: r.category, description: r.description }));
}
// 서버 건수만 (가벼운 확인용)
async function sbCount() {
  const res = await fetch(SB_TABLE + '?select=id', { method: 'HEAD', headers: { ...SB_HEAD, Prefer: 'count=exact' }, cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const cr = res.headers.get('content-range') || '';
  return parseInt(cr.split('/')[1], 10) || 0;
}

// ========== SYNC STATUS ==========
function setSyncStatus(state, msg) {
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  dot.className = 'sync-dot';

  if (state === 'connected') {
    dot.classList.add('connected');
    text.textContent = msg || '서버 연결됨';
  } else if (state === 'loading') {
    dot.classList.add('loading');
    text.textContent = msg || '동기화 중...';
  } else if (state === 'error') {
    dot.classList.add('error');
    text.textContent = msg || '연결 오류';
  } else {
    text.textContent = '연결 안됨';
  }
}

// ========== DATA: LOAD ==========
async function refreshData() {
  if (!SCRIPT_URL) {
    setSyncStatus('off');
    return;
  }

  setSyncStatus('loading', '데이터 불러오는 중...');

  try {
    entries = await sbFetchEntries();
    updateCount();
    renderList();
    setSyncStatus('connected', '서버 연결됨 · ' + entries.length + '건');
  } catch (err) {
    console.error(err);
    setSyncStatus('error', '연결 오류: ' + err.message);
  }
}

// ========== DATA: SAVE ==========
async function postToSheet(data) {
  if (!SCRIPT_URL) return false;

  try {
    const res = await fetch(SB_TABLE, {
      method: 'POST',
      headers: { ...SB_HEAD, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ time: data.time, my_name: data.myName, target_name: data.targetName, category: data.category, description: data.description })
    });
    if (!res.ok) console.error('저장 실패', res.status, await res.text());
    return res.ok;
  } catch (err) {
    console.error(err);
    return false;
  }
}

// ========== TABS ==========
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

  if (tab === 'submit') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('panel-submit').classList.add('active');
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('panel-list').classList.add('active');
    renderList();
  }
}

// ========== KOREAN INPUT ==========
let composing = false;

function setupKoreanInput(inputEl, countEl, maxLen, koreanOnly) {
  inputEl.addEventListener('compositionstart', () => { composing = true; });
  inputEl.addEventListener('compositionend', () => {
    composing = false;
    if (koreanOnly) {
      inputEl.value = inputEl.value.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣ]/g, '');
    }
    enforceMax(inputEl, countEl, maxLen);
  });
  inputEl.addEventListener('input', () => {
    if (!composing) {
      if (koreanOnly) {
        const pos = inputEl.selectionStart;
        const before = inputEl.value;
        inputEl.value = before.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣ]/g, '');
        const diff = before.length - inputEl.value.length;
        inputEl.setSelectionRange(pos - diff, pos - diff);
      }
      enforceMax(inputEl, countEl, maxLen);
    } else {
      countEl.textContent = inputEl.value.length;
    }
    inputEl.classList.remove('error');
  });
  inputEl.addEventListener('paste', (e) => {
    if (koreanOnly) {
      setTimeout(() => {
        inputEl.value = inputEl.value.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣ]/g, '');
        enforceMax(inputEl, countEl, maxLen);
      }, 0);
    }
  });
}

function enforceMax(inputEl, countEl, maxLen) {
  if (inputEl.value.length > maxLen) {
    inputEl.value = inputEl.value.slice(0, maxLen);
  }
  countEl.textContent = inputEl.value.length;
}

setupKoreanInput(document.getElementById('myName'), document.getElementById('myNameCount'), 4, true);
setupKoreanInput(document.getElementById('targetName'), document.getElementById('targetNameCount'), 4, true);
setupKoreanInput(document.getElementById('description'), document.getElementById('descCount'), 300, false);

document.getElementById('category').addEventListener('change', function() {
  this.classList.remove('placeholder', 'error');
});

function isValidKoreanName(name) {
  return /^[가-힣]{2,4}$/.test(name);
}

// ========== SUBMIT ==========
async function submitForm() {
  const myName = document.getElementById('myName').value.trim();
  const targetName = document.getElementById('targetName').value.trim();
  const category = document.getElementById('category').value;
  const description = document.getElementById('description').value.trim();

  let hasError = false;

  if (!isValidKoreanName(myName)) { document.getElementById('myName').classList.add('error'); hasError = true; }
  if (!isValidKoreanName(targetName)) { document.getElementById('targetName').classList.add('error'); hasError = true; }
  if (!category) { document.getElementById('category').classList.add('error'); hasError = true; }
  if (!description) { document.getElementById('description').classList.add('error'); hasError = true; }
  if (hasError) return;

  const now = new Date();
  const timeStr = now.getFullYear() + '.' +
    String(now.getMonth()+1).padStart(2,'0') + '.' +
    String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0');

  const entry = { myName, targetName, category, description, time: timeStr };

  // 버튼 로딩 상태
  const btn = document.querySelector('.submit-btn');
  const btnText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> 저장 중...';

  // 서버에 저장
  let sheetOk = false;
  if (SCRIPT_URL) {
    setSyncStatus('loading', '저장 중...');
    sheetOk = await postToSheet(entry);
  }

  // 로컬 목록에 추가
  entries.unshift({ id: Date.now(), ...entry });
  updateCount();

  // 버튼 복구
  btn.disabled = false;
  btn.innerHTML = btnText;

  if (SCRIPT_URL && sheetOk) {
    refreshData();
    setSyncStatus('connected', '서버 연결됨 · ' + entries.length + '건');
    showToast('toast');
  } else if (SCRIPT_URL && !sheetOk) {
    setSyncStatus('error', '저장 실패 — 이 화면에만 보입니다. 다시 접수해 주세요');
    showToast('toast');
  } else {
    showToast('toast');
  }

  // Reset form
  document.getElementById('myName').value = '';
  document.getElementById('targetName').value = '';
  document.getElementById('category').value = '';
  document.getElementById('category').classList.add('placeholder');
  document.getElementById('description').value = '';
  document.getElementById('myNameCount').textContent = '0';
  document.getElementById('targetNameCount').textContent = '0';
  document.getElementById('descCount').textContent = '0';

  setTimeout(() => switchTab('list'), 600);
}

// ========== UTILS ==========
function updateCount() {
  document.getElementById('listCount').textContent = entries.length;
  document.getElementById('totalText').textContent = '총 ' + entries.length + '건';
  document.getElementById('exportBtn').disabled = entries.length === 0;
}

function exportExcel() {
  if (entries.length === 0) return;

  const rows = entries.map(e => ({
    '날짜': e.time,
    '본인 이름': e.myName,
    '공로자 이름': e.targetName,
    '공로': e.category,
    '공로 내용': e.description
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{ wch: 18 },{ wch: 10 },{ wch: 10 },{ wch: 24 },{ wch: 50 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'E-Star 접수목록');

  const today = new Date();
  const dateStr = today.getFullYear() + String(today.getMonth()+1).padStart(2,'0') + String(today.getDate()).padStart(2,'0');
  XLSX.writeFile(wb, 'E-Star_접수목록_' + dateStr + '.xlsx');
}

function showToast(id) {
  const toast = document.getElementById(id);
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

function deleteEntry(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  entries = entries.filter(e => e.id !== id);
  updateCount();
  renderList();
}

function getFilteredEntries() {
  const sender = document.getElementById('searchSender').value.trim();
  const receiver = document.getElementById('searchReceiver').value.trim();

  return entries.filter(e => {
    if (sender && !e.myName.includes(sender)) return false;
    if (receiver && !e.targetName.includes(receiver)) return false;
    return true;
  });
}

function filterList() {
  renderList();
}

function clearSearch() {
  document.getElementById('searchSender').value = '';
  document.getElementById('searchReceiver').value = '';
  renderList();
}

function renderList() {
  const container = document.getElementById('listContainer');
  const filtered = getFilteredEntries();

  if (entries.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">0</div>
        <p>아직 접수된 내역이 없습니다.<br>첫 번째 E-Star를 접수해 보세요!</p>
      </div>`;
    return;
  }

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">—</div>
        <p>검색 결과가 없습니다.</p>
      </div>`;
    return;
  }

  const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  container.innerHTML = filtered.map(e => `
    <div class="list-card">
      <div class="card-top">
        <div class="card-badge">${esc(e.category)}</div>
        <div class="card-top-right">
          <span class="card-time">${esc(e.time)}</span>
        </div>
      </div>
      <div class="card-names">
        <span class="card-name">${esc(e.myName)}</span>
        <span class="card-arrow">→</span>
        <span class="card-recognizer">${esc(e.targetName)}</span>
      </div>
      <div class="card-desc">${esc(e.description)}</div>
    </div>
  `).join('');
}

// ========== INIT ==========
if (SCRIPT_URL) {
  refreshData();
} else {
  setSyncStatus('off');
}

// ========== PWA MANIFEST (inline) ==========
const manifest = {
  name: 'E-Star MFG',
  short_name: 'E-Star',
  start_url: location.href,
  display: 'standalone',
  background_color: '#ECEAE5',
  theme_color: '#ECEAE5',
  icons: [{
    src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" fill="%23141414"/><text x="96" y="128" font-size="96" font-weight="900" font-family="Arial" text-anchor="middle" fill="%23D63A0E">E★</text></svg>',
    sizes: '192x192',
    type: 'image/svg+xml',
    purpose: 'any'
  }]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
const manifestUrl = URL.createObjectURL(manifestBlob);
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest';
manifestLink.href = manifestUrl;
document.head.appendChild(manifestLink);

// ========== NOTIFICATION & BADGE ==========
let lastKnownCount = entries.length;
let notifPermission = Notification.permission || 'default';

// 알림 권한 요청
async function requestNotifPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    notifPermission = await Notification.requestPermission();
  } else {
    notifPermission = Notification.permission;
  }
}

// 새 접수 알림 보내기
function showNotification(entry) {
  if (notifPermission !== 'granted') return;

  const notif = new Notification('⭐ 새 E-Star 접수!', {
    body: `${entry.myName} → ${entry.targetName}\n[${entry.category}] ${entry.description}`,
    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="%23141414"/><text x="32" y="44" font-size="32" font-weight="900" font-family="Arial" text-anchor="middle" fill="%23D63A0E">E★</text></svg>',
    tag: 'estar-' + Date.now(),
    requireInteraction: false
  });

  notif.onclick = () => {
    window.focus();
    switchTab('list');
    notif.close();
  };
}

// 뱃지 업데이트
function updateBadge(count) {
  if ('setAppBadge' in navigator) {
    if (count > 0) {
      navigator.setAppBadge(count).catch(() => {});
    } else {
      navigator.clearAppBadge().catch(() => {});
    }
  }
}

// 새 데이터 폴링 (30초 간격)
async function pollForUpdates() {
  if (!SCRIPT_URL || document.hidden) return;

  try {
    // 건수만 먼저 확인하고, 늘었을 때만 목록을 받음
    const total = await sbCount();
    if (total > lastKnownCount) {
      const fresh = await sbFetchEntries();
      const newCount = fresh.length - lastKnownCount;
      const newEntries = fresh.slice(0, newCount);

      // 내가 방금 보낸 건 제외 (최근 10초 이내 접수는 스킵)
      newEntries.forEach(entry => {
        showNotification(entry);
      });

      updateBadge(newCount);

      // 목록 갱신
      entries = fresh;
      lastKnownCount = entries.length;
      updateCount();
      setSyncStatus('connected', '서버 연결됨 · ' + entries.length + '건');

      // 목록 탭이 열려있으면 즉시 렌더
      if (document.getElementById('panel-list').classList.contains('active')) {
        renderList();
      }
    }
  } catch (err) {
    // 폴링 실패는 무시 (다음 사이클에 재시도)
  }
}

// 앱 포커스 시 뱃지 초기화
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    updateBadge(0);
  }
});

// 초기 권한 요청 + 폴링 시작
requestNotifPermission();
setInterval(pollForUpdates, 30000);

// 접수 완료 후 카운트 동기화
const origUpdateCount = updateCount;
updateCount = function() {
  origUpdateCount();
  lastKnownCount = entries.length;
};
</script>
</body>
</html>
